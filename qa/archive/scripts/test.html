<!DOCTYPE html>
<html>
<head>
<style>
:root { --ease-out: cubic-bezier(0.1, 0.9, 0.2, 1); }
body { background: #111; color: white; overflow: hidden; font-family: sans-serif; }
.states-car { margin-top: 100px; position: relative; }
.sc-track { display: flex; justify-content: center; height: 300px; }
.sc-card {
  position: absolute;
  width: 200px; height: 250px;
  background: #222; border: 1px solid #444; border-radius: 10px;
  transform: translateX(calc(var(--off) * 30%)) scale(calc(1 - var(--offa) * 0.18));
  opacity: calc(1 - min(1, var(--offa)) * 0.62 - max(0, var(--offa) - 1) * 0.2);
  transition: transform .7s var(--ease-out), opacity .7s;
  display: grid; place-items: center; font-size: 24px;
}
@keyframes wrapNext {
  0%   { transform:translateX(calc(-2 * 30%)) scale(0.64); opacity:0.18; }
  35%  { transform:translateX(calc(-3 * 30%)) scale(0.46); opacity:0; }
  45%  { transform:translateX(calc( 3 * 30%)) scale(0.46); opacity:0; }
  100% { transform:translateX(calc( 2 * 30%)) scale(0.64); opacity:0.18; }
}
@keyframes wrapPrev {
  0%   { transform:translateX(calc( 2 * 30%)) scale(0.64); opacity:0.18; }
  35%  { transform:translateX(calc( 3 * 30%)) scale(0.46); opacity:0; }
  45%  { transform:translateX(calc(-3 * 30%)) scale(0.46); opacity:0; }
  100% { transform:translateX(calc(-2 * 30%)) scale(0.64); opacity:0.18; }
}
.sc-card.wrap-next { animation: wrapNext .7s var(--ease-out) forwards; transition: none !important; }
.sc-card.wrap-prev { animation: wrapPrev .7s var(--ease-out) forwards; transition: none !important; }
</style>
</head>
<body>
<div class="states-car">
  <div class="sc-track" id="track">
    <div class="sc-card">01</div>
    <div class="sc-card">02</div>
    <div class="sc-card">03</div>
    <div class="sc-card">04</div>
    <div class="sc-card">05</div>
  </div>
</div>
<button onclick="go(1)">Next</button>
<button onclick="go(-1)">Prev</button>

<script>
const cards = document.querySelectorAll('.sc-card');
let i = 0;
function paint() {
  cards.forEach((c, k) => {
    let off = (k - i + 5) % 5;
    if (off > 2) off -= 5;
    
    let prevOffStr = c.getAttribute('data-off');
    let prevOff = prevOffStr ? parseInt(prevOffStr) : off;
    c.setAttribute('data-off', off);

    c.classList.remove('wrap-next', 'wrap-prev');
    void c.offsetWidth;

    if (prevOff === -2 && off === 2) {
      c.classList.add('wrap-next');
      c.style.setProperty('--off', 2);
      c.style.setProperty('--offa', 2);
      c.style.zIndex = '8';
      return;
    } else if (prevOff === 2 && off === -2) {
      c.classList.add('wrap-prev');
      c.style.setProperty('--off', -2);
      c.style.setProperty('--offa', 2);
      c.style.zIndex = '8';
      return;
    }

    c.style.setProperty('--off', off);
    c.style.setProperty('--offa', Math.abs(off));
    c.style.zIndex = String(10 - Math.abs(off));
  });
}
paint();
function go(dir) {
  i = (i + dir + 5) % 5;
  paint();
}
</script>
</body>
</html>
